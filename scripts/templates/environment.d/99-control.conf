# control-center 用户级系统环境（setup-env.sh 按模板渲染）
# systemd 用户会话自动导入（loginctl enable-linger / 重新登录生效）；
# 不支持变量展开，路径为渲染后的字面量
CONTROL_HOME=$BASE_HOME/control-center
REPOS_GITDIR=$BASE_HOME/.repos
WORKTREE_ROOT=$BASE_HOME/wt
LITELLM_ENDPOINT=$LITELLM_ENDPOINT
PIEKBS_KB=$BASE_HOME/control-wiki
PIP_INDEX_URL=$PIP_INDEX_URL
UV_INDEX_URL=$UV_INDEX_URL
GOPROXY=https://goproxy.cn,direct
NVM_NODEJS_ORG_MIRROR=https://npmmirror.com/mirrors/node
PATH=$BASE_HOME/.local/bin:$BASE_HOME/.venv/bin:/usr/local/bin:/usr/bin:/bin
