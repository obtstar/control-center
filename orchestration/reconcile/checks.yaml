# 对账检查项（方案 D-2）：文档声明 vs 代码/配置事实的定期校验
# 消费方：control-api reconcile 子命令（internal/reconcile；字段语义以其代码为准）
# 路径约定：doc 相对 control-center 根；fact 相对工作用户 home（paths.home）
# 退出语义：任一 CONFLICT → 退出码 1；仅 WARN → 0
# 建议调度（人工安装，示例）：crontab -e →  */17 * * * * $HOME/control-api/control-api reconcile >> $HOME/logs/reconcile.log 2>&1
checks:
  - id: backend-stack
    desc: 后端技术栈（01 章 ↔ control-api/go.mod）
    doc: docs/architecture/01-overview.md
    doc_must: ["Go 1.25"]                      # 文档必须包含
    doc_must_not: ["Spring Boot", "Java 后端"] # 禁止表述复活即漂移
    fact: control-api/go.mod
    fact_must: ["module control-api"]
    fact_must_not: ["springframework"]

  - id: frontend-stack
    desc: 前端技术栈（06 章 ↔ control-web/package.json 依赖）
    doc: docs/architecture/06-web.md
    doc_must: ["React", "PrimeReact", "Vite"]
    doc_must_not: ["Vue", "Angular"]
    fact: control-web/package.json
    fact_json_deps: ["react", "primereact", "vite"]  # dependencies/devDependencies 键名

  - id: database
    desc: 数据库（01/08 章 ↔ control-api 实际驱动）
    doc: docs/architecture/08-data-model.md
    doc_must: ["SQLite"]
    fact: control-api/go.mod
    fact_must: ["modernc.org/sqlite"]
    fact_must_not: ["go-sql-driver/mysql", "lib/pq"]

  - id: registry-schema
    desc: 注册表字段（14.2 声明 ↔ registry/repos.yaml 实际条目）
    fact: control-center/registry/repos.yaml
    registry_fields:                             # 声明出处：docs/architecture/14-multi-repo.md 14.2
      required: [repo_key, git_url]
      allowed: [repo_key, name, path, git_url, api_type, api_endpoint,
                token_ref, openapi_ref, default_branch, max_worktrees,
                executor_allowed, disabled]
    # 未知字段 = WARN（增量漂移，提示 14.2 未声明）；缺 required = CONFLICT

  - id: kb-mirror-freshness
    desc: KB 权柄镜像新鲜度（control-wiki/raw/platform/ 派生副本 ↔ 上游 Git 权威；FINDING-051）
    # mirror_pairs 为唯一镜像清单：kb-sync.sh 与 reconcile 均解析本块（路径相对 home）。
    # 新增权柄文档/新架构篇章须在此登记，否则不在检索面、对账也漏盯。
    mirror_pairs:
      - {upstream: control-center/docs/architecture/00-principles.md, mirror: control-wiki/raw/platform/architecture/00-principles.md}
      - {upstream: control-center/docs/architecture/01-overview.md, mirror: control-wiki/raw/platform/architecture/01-overview.md}
      - {upstream: control-center/docs/architecture/02-branch-worktree.md, mirror: control-wiki/raw/platform/architecture/02-branch-worktree.md}
      - {upstream: control-center/docs/architecture/03-doc-management.md, mirror: control-wiki/raw/platform/architecture/03-doc-management.md}
      - {upstream: control-center/docs/architecture/04-ai-gateway.md, mirror: control-wiki/raw/platform/architecture/04-ai-gateway.md}
      - {upstream: control-center/docs/architecture/05-orchestration.md, mirror: control-wiki/raw/platform/architecture/05-orchestration.md}
      - {upstream: control-center/docs/architecture/06-web.md, mirror: control-wiki/raw/platform/architecture/06-web.md}
      - {upstream: control-center/docs/architecture/07-workflows.md, mirror: control-wiki/raw/platform/architecture/07-workflows.md}
      - {upstream: control-center/docs/architecture/08-data-model.md, mirror: control-wiki/raw/platform/architecture/08-data-model.md}
      - {upstream: control-center/docs/architecture/09-data-flow.md, mirror: control-wiki/raw/platform/architecture/09-data-flow.md}
      - {upstream: control-center/docs/architecture/10-deployment.md, mirror: control-wiki/raw/platform/architecture/10-deployment.md}
      - {upstream: control-center/docs/architecture/11-security.md, mirror: control-wiki/raw/platform/architecture/11-security.md}
      - {upstream: control-center/docs/architecture/12-roadmap.md, mirror: control-wiki/raw/platform/architecture/12-roadmap.md}
      - {upstream: control-center/docs/architecture/13-repo-template.md, mirror: control-wiki/raw/platform/architecture/13-repo-template.md}
      - {upstream: control-center/docs/architecture/14-multi-repo.md, mirror: control-wiki/raw/platform/architecture/14-multi-repo.md}
      - {upstream: control-center/docs/architecture/15-server-module.md, mirror: control-wiki/raw/platform/architecture/15-server-module.md}
      - {upstream: control-center/docs/architecture/16-linux-permissions.md, mirror: control-wiki/raw/platform/architecture/16-linux-permissions.md}
      - {upstream: control-center/docs/architecture/17-client-server-design.md, mirror: control-wiki/raw/platform/architecture/17-client-server-design.md}
      - {upstream: control-center/docs/architecture/18-authority.md, mirror: control-wiki/raw/platform/architecture/18-authority.md}
      - {upstream: control-center/docs/architecture/19-workbench-strategy.md, mirror: control-wiki/raw/platform/architecture/19-workbench-strategy.md}
      - {upstream: control-center/docs/architecture/README.md, mirror: control-wiki/raw/platform/architecture/README.md}
      - {upstream: control-center/docs/FINDINGS.md, mirror: control-wiki/raw/platform/FINDINGS.md}
      - {upstream: control-center/orchestration/workflows/pipeline.yaml, mirror: control-wiki/raw/platform/orchestration/pipeline.yaml}
      - {upstream: control-center/registry/repos.yaml, mirror: control-wiki/raw/platform/registry/repos.yaml}
      - {upstream: control-api/CONVENTIONS.md, mirror: control-wiki/raw/platform/CONVENTIONS.md}
      - {upstream: control-api/DEPENDENCIES.md, mirror: control-wiki/raw/platform/DEPENDENCIES.md}
      - {upstream: control-api/docs/api/openapi.yaml, mirror: control-wiki/raw/platform/api/openapi.yaml}
      - {upstream: AGENTS.md, mirror: control-wiki/raw/platform/AGENTS.md}
