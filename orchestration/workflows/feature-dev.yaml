# Feature 开发工作流：task.md（L1 出现）→ pipeline.yaml 全链
workflow:
  name: feature-dev
  triggers:
    - watch: tasks/             # 新 task.md（watcher → control-api）
      match: "type != bug"
  pipeline: pipeline.yaml       # 6 阶段全链（逐步审批闸）
  skills:                       # 组合规则：stage×1 + domain×N（enforce 四件套强制注入）
    defaults: [backend-go]      # 默认领域技能；按 repo_key 可覆盖（Java 项目用 backend-java）
    by_repo:
      control-web: [frontend-dev]
      control-db: [db-migration]
  enforce: [grounding-check, authority-check, branch-guard, secret-scan]
