# Bugfix 工作流：task.md（type: bug）→ bugfix-pipeline.yaml
workflow:
  name: bugfix
  triggers:
    - watch: tasks/
      match: "type == bug"
  pipeline: bugfix-pipeline.yaml   # 精简链（跳设计，闸留 coding/merge）
  skills:
    defaults: [backend-go]      # 默认领域技能；按 repo_key 可覆盖（Java 项目用 backend-java）
    by_repo:
      control-web: [frontend-dev]
      control-db: [db-migration]
  enforce: [grounding-check, authority-check, branch-guard, secret-scan]
